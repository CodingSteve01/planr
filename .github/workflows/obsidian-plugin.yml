name: Release Obsidian plugin

# Tags in this repository are Obsidian plugin releases: the tag name is the
# plugin version and must match manifest.json exactly, with no "v" prefix —
# that is what Obsidian's community-plugin installer and BRAT look for.
#
#   npm version --no-git-tag-version 1.1.0   # bump package.json
#   # bump manifest.json + versions.json to match
#   git tag 1.1.0 && git push --tags

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check the tag matches manifest.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $tag does not match manifest.json version $manifest" >&2
            exit 1
          fi

      - run: npm test
      - run: npm run build:obsidian

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Obsidian downloads these three by name from the release assets —
          # a zip is not accepted.
          files: |
            dist-obsidian/main.js
            dist-obsidian/manifest.json
            dist-obsidian/styles.css

      - name: Keep the build when there is no tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-plugin
          path: dist-obsidian
